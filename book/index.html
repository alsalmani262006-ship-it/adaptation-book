<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b34a8">
  <meta name="description" content="كتاب إلكتروني تفاعلي في العلوم: التكيّف لدى الكائنات الحية، مع ١٥ نشاطًا تفاعليًا.">
  <title>التكيّف لدى الكائنات الحية | كتاب إلكتروني تفاعلي</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8C%B5%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/css/base.css">
  <link rel="stylesheet" href="css/book.css">
</head>
<body class="viewer">
  <header class="vbar">
    <button class="vbtn" id="menu" aria-label="فهرس الكتاب" aria-expanded="false" title="الفهرس">☰</button>
    <div class="vtitle"><b>التكيّف لدى الكائنات الحية</b><span id="pagetitle"></span></div>
    <span class="vpage" id="pageinfo" aria-live="polite"></span>
    <button class="vbtn" id="zoom" aria-label="تكبير" aria-pressed="false" title="تكبير / تصغير">🔍</button>
    <button class="vbtn hide-sm" id="fs" aria-label="ملء الشاشة" title="ملء الشاشة">⛶</button>
    <button class="vbtn" id="print" aria-label="طباعة أو حفظ PDF" title="طباعة / PDF">🖨</button>
  </header>

  <main class="stage" id="stage">
    <button class="nav prev" id="prev" aria-label="الصفحة السابقة" title="السابق (→)">→</button>
    <div class="bookwrap" id="bookwrap"><div class="book" id="book"></div></div>
    <button class="nav next" id="next" aria-label="الصفحة التالية" title="التالي (←)">←</button>
  </main>

  <nav class="toc" id="toc" hidden></nav>
  <div id="print-root" aria-hidden="true"></div>

  <noscript><p style="padding:20px">يحتاج الكتاب التفاعلي إلى تفعيل JavaScript في المتصفح.</p></noscript>

  <script src="config.js"></script>
  <script src="../qr/qr-data.js"></script>
  <script src="../shared/js/data.js"></script>
  <script src="../shared/js/art.js"></script>
  <script src="../shared/js/games.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
